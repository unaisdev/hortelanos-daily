[package]
name = "hortelanos-daily"
version = "1.0.1"
description = "Hortelano's Daily launcher"
authors = ["unaisdev"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hortelanos_daily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
mime_guess = "2"
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros"] }
futures-util = "0.3"
semver = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
