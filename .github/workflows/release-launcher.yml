name: release-launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol packs
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: Hortelano's Daily ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: |
            Builds **sin firma de código**. Ver `docs/UNSIGNED_INSTALL.md` y `SHA256SUMS`.

            - **Windows portable:** `*-x64-portable.zip` (descomprimir y ejecutar, sin instalar).
            - Content packs de cada juego se publican en sus repos (`content-v*`).
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "portable/Hortelanos Daily"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike '*setup*' -and $_.Name -notlike '*uninstall*' } |
            Select-Object -First 1
          if (-not $exe) { throw "No release exe found under src-tauri/target/release" }

          Copy-Item $exe.FullName -Destination (Join-Path $stage "Hortelanos Daily.exe")

          $resCandidates = @(
            "src-tauri/target/release/resources",
            "src-tauri/target/release/hortelanos-daily_resources",
            "src-tauri/target/release/Hortelanos Daily_resources"
          )
          $copiedRes = $false
          foreach ($res in $resCandidates) {
            if (Test-Path $res) {
              Copy-Item $res -Destination (Join-Path $stage "resources") -Recurse -Force
              $copiedRes = $true
              break
            }
          }
          # Fallback: copy bundled static trees next to the exe
          if (-not $copiedRes) {
            $resDir = Join-Path $stage "resources"
            New-Item -ItemType Directory -Force -Path $resDir | Out-Null
            foreach ($name in @('shell','runner','catalog','games','docs','index.html')) {
              $src = Join-Path "desktop-www" $name
              if (Test-Path $src) {
                Copy-Item $src -Destination (Join-Path $resDir $name) -Recurse -Force
              }
            }
          }

          $readme = @(
            "Hortelano's Daily - Windows portable",
            "====================================",
            "1. Unzip this folder anywhere.",
            "2. Run Hortelanos Daily.exe.",
            "3. Keep the resources/ folder next to the exe.",
            "4. Needs Microsoft Edge WebView2 (usually already on Windows 10/11).",
            "5. Unsigned build: SmartScreen -> More info -> Run anyway."
          ) -join "`n"
          Set-Content -Path (Join-Path $stage "README-portable.txt") -Value $readme -Encoding UTF8

          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "Hortelanos.Daily_${ver}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          gh release upload "$env:RELEASE_TAG" $zip --clobber

  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release || true
          if ls dist/release/* >/dev/null 2>&1; then
            (
              cd dist/release
              shasum -a 256 * > SHA256SUMS
            )
            gh release upload "$TAG" dist/release/SHA256SUMS --clobber
            cp catalog/catalog.json dist/release/catalog.json
            gh release upload "$TAG" dist/release/catalog.json --clobber
          fi
