name: release-launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol packs
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred
          scripts/verify-protocol.sh games/dailysteven

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # Intel build is cross-compiled on the Apple Silicon runner (macos-13 is retired).
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        run: npm ci

      - name: Read release notes for the launcher version
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match launcher version $version"
          }
          $notes = Get-Content -Raw -Encoding utf8 -LiteralPath "docs/launcher-releases/$version.md" -ErrorAction Stop
          $delimiter = [Guid]::NewGuid().ToString()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value @("body<<$delimiter", $notes.TrimEnd(), $delimiter)

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (Ed25519, ours — not an Apple/Microsoft certificate).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: Hortelano's Daily ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/*/release/bundle/dmg -name '*.dmg' | head -1 || true)
          APP=$(find src-tauri/target/*/release/bundle/macos -maxdepth 1 -name '*.app' | head -1 || true)
          MOUNT=""
          cleanup() {
            if [ -n "${MOUNT}" ]; then hdiutil detach "${MOUNT}" -force >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          if [ -n "${DMG}" ]; then
            echo "Mounting ${DMG}"
            ATTACH_OUT=$(hdiutil attach -nobrowse -readonly "${DMG}")
            MOUNT=$(echo "${ATTACH_OUT}" | awk '/\/Volumes\// {print substr($0, index($0, "/Volumes/"))}' | tail -1)
            APP="${MOUNT}/Hortelanos Daily.app"
          fi
          if [ -z "${APP}" ] || [ ! -d "${APP}" ]; then
            echo "No macOS .app found to verify" >&2
            exit 1
          fi
          echo "Verifying: ${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=2 "${APP}"
          test -f "${APP}/Contents/_CodeSignature/CodeResources"
          echo "macOS ad-hoc signature OK"

      - name: Package Windows portable ZIP (signed, self-updating)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # On Windows, Tauri resource_dir() is the folder that contains the exe.
          # Assets (shell/, runner/, …) must sit next to Hortelanos Daily.exe — NOT under resources/.
          $stage = "portable/Hortelanos Daily"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike '*setup*' -and $_.Name -notlike '*uninstall*' } |
            Select-Object -First 1
          if (-not $exe) { throw "No release exe found under src-tauri/target/release" }
          # The exe name must match ZIP_EXE_NAME in src-tauri/src/portable.rs.
          Copy-Item $exe.FullName -Destination (Join-Path $stage "Hortelanos Daily.exe")

          $required = @('shell','runner','shared','catalog','games')
          $optional = @('docs','index.html')
          $copied = @{}
          foreach ($root in @("src-tauri/target/release", "desktop-www")) {
            foreach ($name in ($required + $optional)) {
              if ($copied.ContainsKey($name)) { continue }
              $src = Join-Path $root $name
              if (Test-Path $src) {
                Copy-Item $src -Destination (Join-Path $stage $name) -Recurse -Force
                $copied[$name] = $true
              }
            }
          }
          foreach ($name in $required) {
            if (-not $copied.ContainsKey($name)) {
              throw "Portable pack missing required asset '$name' (looked in target/release and desktop-www)"
            }
          }
          if (-not (Test-Path (Join-Path $stage "shell/index.html"))) { throw "Portable pack incomplete: shell/index.html missing" }
          if (-not (Test-Path (Join-Path $stage "shared/ranking-ui.js"))) { throw "Portable pack incomplete: shared/ranking-ui.js missing" }

          Get-ChildItem "src-tauri/target/release/*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path $stage $_.Name) -Force }

          # Marker: tells the app it runs from an unzipped folder, so it self-updates this folder
          # (src-tauri/src/portable.rs) instead of using the installer-based updater.
          Set-Content -Path (Join-Path $stage "portable.txt") -Value "Portable build: updates itself in place. Delete this file to disable that." -Encoding utf8NoBOM

          $readme = @(
            "Hortelano's Daily - Windows portable",
            "====================================",
            "1. Unzip this folder anywhere you can write to (not Program Files).",
            "2. Run Hortelanos Daily.exe.",
            "3. Keep shell/, runner/, shared/, catalog/, games/ next to the exe (same folder).",
            "4. It updates itself when you open it; no need to download a new zip.",
            "5. Needs Microsoft Edge WebView2 (usually already on Windows 10/11).",
            "6. Unsigned build: SmartScreen -> More info -> Run anyway."
          ) -join "`n"
          Set-Content -Path (Join-Path $stage "README-portable.txt") -Value $readme -Encoding utf8NoBOM

          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "Hortelanos.Daily_${ver}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($needle in @('shell[/\\]index\.html$', 'shared[/\\]ranking-ui\.js$', 'portable\.txt$', 'Hortelanos Daily\.exe$')) {
            if (-not ($entries | Where-Object { $_ -match $needle })) { throw "Portable ZIP missing $needle" }
          }
          Write-Host "Portable entries: $($entries.Count)"

          # Sign with the updater key and publish the manifest the app reads.
          npx tauri signer sign $zip
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }
          $sig = (Get-Content "$zip.sig" -Raw).Trim()
          $manifest = [ordered]@{
            version   = $ver
            url       = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$zip"
            signature = $sig
          } | ConvertTo-Json
          Set-Content -Path portable.json -Value $manifest -Encoding utf8NoBOM

          gh release upload "$env:RELEASE_TAG" $zip "$zip.sig" portable.json --clobber

  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release || true
          if ls dist/release/* >/dev/null 2>&1; then
            (
              cd dist/release
              shasum -a 256 * > SHA256SUMS
            )
            gh release upload "$TAG" dist/release/SHA256SUMS --clobber
            cp catalog/catalog.json dist/release/catalog.json
            gh release upload "$TAG" dist/release/catalog.json --clobber
          fi
