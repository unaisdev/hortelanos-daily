name: release-launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol packs
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: Hortelano's Daily ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: |
            Builds **sin firma de código**. Ver `docs/UNSIGNED_INSTALL.md` y `SHA256SUMS`.

            Content packs de cada juego se publican en sus repos (`content-v*`).
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release || true
          if ls dist/release/* >/dev/null 2>&1; then
            (
              cd dist/release
              shasum -a 256 * > SHA256SUMS
            )
            gh release upload "$TAG" dist/release/SHA256SUMS --clobber
            cp catalog/catalog.json dist/release/catalog.json
            gh release upload "$TAG" dist/release/catalog.json --clobber
          fi
