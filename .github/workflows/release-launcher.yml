name: release-launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol packs
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Inject telemetry secrets (from GitHub Actions secret)
        env:
          HORTELANO_SENTRY_DSN: ${{ secrets.HORTELANO_SENTRY_DSN }}
          HORTELANO_TELEMETRY_ENV: production
          HORTELANO_TELEMETRY_RELEASE: hortelanos-daily@${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: node scripts/inject-telemetry-secrets.mjs

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          HORTELANO_SENTRY_DSN: ${{ secrets.HORTELANO_SENTRY_DSN }}
          HORTELANO_TELEMETRY_ENV: production
          HORTELANO_TELEMETRY_RELEASE: hortelanos-daily@${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: Hortelano's Daily ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: |
            ## Novedades

            - Ahora puedes ver las novedades del launcher y de los juegos desde el menú, sin salir a GitHub.
            - Si hay algo nuevo, el botón Novedades se destaca para que no se te pase.
            - Las notas se escriben en castellano claro, solo con lo que un jugador puede notar.

            ## Descarga

            - En Windows: baja el zip portable, descomprímelo y ábrelo. No hace falta instalar nada.
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          $ErrorActionPreference = 'Stop'
          # On Windows, Tauri resource_dir() is the folder that contains the exe.
          # Assets (shell/, runner/, …) must sit next to Hortelanos Daily.exe — NOT under resources/.
          $stage = "portable/Hortelanos Daily"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike '*setup*' -and $_.Name -notlike '*uninstall*' } |
            Select-Object -First 1
          if (-not $exe) { throw "No release exe found under src-tauri/target/release" }
          Copy-Item $exe.FullName -Destination (Join-Path $stage "Hortelanos Daily.exe")

          # Prefer files Tauri already staged next to the release binary.
          $assetRoots = @(
            "src-tauri/target/release",
            "desktop-www"
          )
          $required = @('shell','runner','shared','catalog','games')
          $optional = @('docs','index.html')
          $copied = @{}
          foreach ($root in $assetRoots) {
            foreach ($name in ($required + $optional)) {
              if ($copied.ContainsKey($name)) { continue }
              $src = Join-Path $root $name
              if (Test-Path $src) {
                Copy-Item $src -Destination (Join-Path $stage $name) -Recurse -Force
                $copied[$name] = $true
              }
            }
          }
          foreach ($name in $required) {
            if (-not $copied.ContainsKey($name)) {
              throw "Portable pack missing required asset '$name' (looked in target/release and desktop-www)"
            }
          }
          $shellIndex = Join-Path $stage "shell/index.html"
          if (-not (Test-Path $shellIndex)) {
            throw "Portable pack incomplete: shell/index.html missing"
          }

          # Sidecar DLLs if present (WebView2 loader, etc.)
          Get-ChildItem "src-tauri/target/release/*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path $stage $_.Name) -Force }

          $readme = @(
            "Hortelano's Daily - Windows portable",
            "====================================",
            "1. Unzip this folder anywhere.",
            "2. Run Hortelanos Daily.exe.",
            "3. Keep shell/, runner/, catalog/, games/ next to the exe (same folder).",
            "4. Needs Microsoft Edge WebView2 (usually already on Windows 10/11).",
            "5. Unsigned build: SmartScreen -> More info -> Run anyway."
          ) -join "`n"
          Set-Content -Path (Join-Path $stage "README-portable.txt") -Value $readme -Encoding UTF8

          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "Hortelanos.Daily_${ver}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -Force

          # Sanity: zip must include shell + runner, not just the exe
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          if (-not ($entries | Where-Object { $_ -match 'shell[/\\]index\.html$' })) {
            throw "Portable ZIP missing shell/index.html"
          }
          Write-Host "Portable entries: $($entries.Count)"
          gh release upload "$env:RELEASE_TAG" $zip --clobber

  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release || true
          if ls dist/release/* >/dev/null 2>&1; then
            (
              cd dist/release
              shasum -a 256 * > SHA256SUMS
            )
            gh release upload "$TAG" dist/release/SHA256SUMS --clobber
            cp catalog/catalog.json dist/release/catalog.json
            gh release upload "$TAG" dist/release/catalog.json --clobber
          fi
