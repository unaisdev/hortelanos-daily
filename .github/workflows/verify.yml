name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:protocols
      - run: npm run test:ranking-seed
      - run: npm run test:steven
      - name: Verify protocol packs and ROM signatures
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred
          scripts/verify-protocol.sh games/dailysteven

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  # The portable self-updater (src-tauri/src/portable.rs) has Windows-only code and relies on
  # Windows rename semantics, so compile and test it on Windows too.
  tauri-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
