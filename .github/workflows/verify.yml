name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dailygold protocol + ROM magic
        run: |
          chmod +x scripts/verify-protocol.sh
          scripts/verify-protocol.sh games/dailygold
          scripts/verify-protocol.sh games/dailyred

      - name: Ensure telemetry secrets are not committed
        run: |
          if [ -f shared/telemetry.secrets.js ]; then
            echo "shared/telemetry.secrets.js must not be in the repo (gitignored secrets only)"
            exit 1
          fi
          if grep -RInE "sentryDsn:\s*'https?://" shared/telemetry.config.js shared/telemetry.secrets.example.js; then
            echo "DSN must not be hardcoded in committed config files"
            exit 1
          fi
          echo "telemetry secrets check OK"

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
